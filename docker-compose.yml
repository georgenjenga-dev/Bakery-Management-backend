version: "3.9"

services:
  backend:
    build: ./backend
    container_name: bakery-backend

    ports:
      - "5000:5000"

    volumes:
      - ./backend:/app

    environment:
      FLASK_APP: run.py
      FLASK_ENV: development

  frontend:
    build: ./frontend
    container_name: bakery-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend